<!DOCTYPE html>
<html lang="en">
    <head>
        <title>eCommerce Website - Victor Asuquo</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="WDD 231 Project - eCommerce Website - Victor Asuquo">
        <meta name="author" content="Victor Asuquo">
        <meta property="og:title" content="Easyshop eCommerce Website">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://vasuquo.github.io/wdd231/project">
        <meta property="og:image" content="https://vasuquo.github.io/wdd231/project/images/logo.webp">   
        <meta property="og:description" content="At EasyShopping we provide online shopping facilities, giving clients means to shop anywhere in the world that they are located.">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="icon" href="./favicon.ico" type="image/x-icon">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link href="styles/ecommerce.css" rel="stylesheet">
        <script src="scripts/ecommerce.js" defer></script>
    </head>
    <body id="Products">
        <header>
            <div class="container">
                <a href="index.html"><img id="logo" src="images/logo.webp" alt="eCommerce Logo"></a>                                
                <div class="layer">
                    <nav>  
                        <ul class="navigation">
                            <li><a href="index.html">Home</a></li>
                            <li><a href="products.html" class="current">Products</a></li>
                            <li><a href="accounts.html">Account</a></li>                                        
                        </ul> 
                      </nav>
                      <div class="icons">
                        <a class="cart-link" href="cart.html"><img id="bag" src="images/cart.svg" alt="Cart"><span class="badge"></span></a> 
                        <img id="menu" src="images/hamburger.svg" alt="menu">
                        <div class="user"></div>  
                      </div>                                    
                </div>
                             
            </div>            
        </header>
        <main>
            <div class="container">
                <div class="row">
                    <h2>All Products</h2>
                    <select name="category" id="category">
                        <option value="all">Select an option...</option>
                        <option value="mens">Men's Ware</option>
                        <option value="womens">Women's ware</option>
                        <option value="jewelries">Jewelries</option>
                        <option value="electronics">Electronics</option>
                        <option value="shoes">Shoes</option>                        
                        <option value="watches">Watches</option>
                    </select>
                </div>
                <section class="all-products caption">    
                    <div class="a-products center">
                    </div>
                </section>
                <dialog id="productDialog">                    
                        <section class="show-case">
                            <div class="product-img">                        
                            </div>
                            <div class="product-details"> 
                                <h1></h1> 
                                <h3 class="price"></h3> 
                                <h4 class="rating"></h4>                   
                                <input type="number" value="1" id="qty" name="qty">
                                <a href="" class="btn">Add To Cart</a>                                                                            
                                <h3 class="pd">Product Details:</h3>
                                <p></p>
                            </div>                                    
                        </section>
                        <button>x</button>                                       
                </dialog>
            </div>            
        </main>
        <footer>
            <div class="container">
                <p id="copyright"></p>
                <p id="modification"></p>
            </div>            
        </footer>    
    </body>
</html>
